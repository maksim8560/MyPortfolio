# Blueprint для Render: Dashboard → New → Blueprint → этот репозиторий.
# Подробности в README, раздел «Деплой».
services:
  - type: web
    name: my-portfolio
    runtime: docker
    plan: free
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/healthz
    autoDeploy: true
    envVars:
      - key: DATA_DIR
        value: /data
      - key: ADMIN_PASSWORD
        sync: false
      # Хранилище контента: без него правки живут только до рестарта.
      # Значения берутся из Upstash → Redis → REST API.
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
      - key: UPSTASH_REDIS_KEY
        value: portfolio:content

    # Персистентный диск: правки из админки выживают рестарт.
    # Требует платного плана (starter и выше) — на free диск не выдаётся.
    # Раскомментируй вместе со сменой plan на starter:
    #
    # plan: starter
    # disk:
    #   name: portfolio-data
    #   mountPath: /data
    #   sizeGB: 1
